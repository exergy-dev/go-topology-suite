name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # also runs the manual-only jobs (race, apidiff, asan)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests run current Go on Linux; a manual run
        # (workflow_dispatch) adds the oldest supported Go (go.mod), macOS
        # and Windows.
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"ubuntu-latest","go":"stable"},{"os":"ubuntu-latest","go":"1.23"},{"os":"macos-latest","go":"stable"},{"os":"windows-latest","go":"stable"}]' || '[{"os":"ubuntu-latest","go":"stable"}]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "go.sum"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  race:
    if: github.event_name == 'workflow_dispatch'   # manual only: run from the Actions tab
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "go.sum"
      - name: go test -race
        run: go test -race ./...

  build:
    name: Build + tidy + gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - name: bench module (separate go.mod)
        run: |
          go build -C bench ./...
          go test -C bench ./...
      - name: tidy check
        run: |
          go mod tidy
          go mod tidy -C bench
          git diff --exit-code go.mod go.sum bench/go.mod bench/go.sum
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt drift in:"; echo "$out"; exit 1
          fi

  conformance:
    name: JTS conformance (8951-case corpus, ${{ matrix.os }})
    # macOS runners are arm64, where the compiler fuses x*y+z into FMA;
    # a manual run (workflow_dispatch) adds macOS to catch arithmetic whose
    # exact tests depend on that.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "go.sum"
      - name: go test -tags=jts
        run: go test -tags=jts -v -run TestJTSConformance ./internal/jtstest/

  apidiff:
    if: github.event_name == 'workflow_dispatch'   # manual only: run from the Actions tab
    name: API compatibility report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: apidiff vs latest tag (report only)
        run: |
          go install golang.org/x/exp/cmd/apidiff@latest
          tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ]; then echo "no tag; skipping"; exit 0; fi
          echo "comparing module API against $tag"
          git worktree add /tmp/base "$tag"
          apidiff -m -incompatible /tmp/base . || true

  asan:
    if: github.event_name == 'workflow_dispatch'   # manual only: run from the Actions tab
    name: Address sanitizer (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: "go.sum"

      - name: go test -asan
        run: go test -asan ./...
